[project]
name = "acme-policy-copilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pranay Poddar", email = "pranaypoddar726@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "datetime>=6.0",
    "deepeval>=4.3.2",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "from-root>=1.3.0",
    "google-genai>=2.34.0",
    "groq>=1.7.0",
    "instructor>=1.17.0",
    "langchain>=1.4.7",
    "langchain-openrouter>=0.2.9",
    "langchain-text-splitters>=1.1.3",
    "langfuse>=5.2.0",
    "ollama>=0.6.3",
    "openai>=3.3.0",
    "portalocker[win32]>=4.4.2",
    "psycopg[binary]>=3.3.8",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.15.1",
    "pypdf>=6.21.4",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
    "rank-bm25>=0.2.2",
    "redis>=8.1.0",
    "sentence-transformers>=6.2.0",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
acme-policy-copilot = "acme_policy_copilot:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
